[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-agent-eval"
version = "0.1.0"
description = "Portable OpenAI-compatible ALFWorld OOD and ScienceWorld L1 evaluator"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2"]
sciworld = ["scienceworld==1.2.3"]
all = [
  "alfworld==0.4.2",
  "scienceworld==1.2.3",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.package-data]
agent_eval = ["alfworld_config.yaml"]
